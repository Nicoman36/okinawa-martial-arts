name: Geocode addresses
on: workflow_dispatch
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: okinawa-github-upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/geocode.py
      - run: python3 scripts/validate_data.py
      - name: Save coordinates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/locations.csv
          git commit -m "Add coordinates from GSI address search" || echo "Nothing to commit"
          git push
